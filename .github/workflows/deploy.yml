name: Provision User Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -v

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Docker build and push
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }}
      
      - name: Setup   Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init and apply
        run: |
          cd terraform
          terraform init
          terraform import azurerm_resource_group.rg /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg || true
          terraform import azurerm_container_registry.acr /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg/providers/Microsoft.ContainerRegistry/registries/${{ secrets.ACR_NAME }} || true
          terraform import azurerm_container_group.aci /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg/providers/Microsoft.ContainerInstance/containerGroups/provision-user || true
          terraform apply -auto-approve \
            -var="acr_password=${{ secrets.ACR_PASSWORD }}" \
            -var="acr_username=${{ secrets.ACR_USERNAME }}" \
            -var="image_name=${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }}"
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}