name: Provision User Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -v

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Docker build and push
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }} .
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }} \
               ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/provision-user:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init and apply
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
          TF_VAR_acr_username: ${{ secrets.ACR_USERNAME }}
          TF_VAR_image_name: "${{ secrets.ACR_NAME }}.azurecr.io/provision-user:${{ github.sha }}"
          TF_VAR_jira_url: ${{ secrets.JIRA_URL }}
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          TF_VAR_graph_tenant_id: ${{ secrets.GRAPH_TENANT_ID }}
          TF_VAR_graph_client_id: ${{ secrets.GRAPH_CLIENT_ID }}
          TF_VAR_graph_client_secret: ${{ secrets.GRAPH_CLIENT_SECRET }}
          TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
        run: |
          cd terraform
          terraform init \
            -backend-config="access_key=${{ secrets.AZURE_STORAGE_KEY }}"
          terraform import azurerm_resource_group.rg /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg || true
          terraform import azurerm_container_registry.acr /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg/providers/Microsoft.ContainerRegistry/registries/${{ secrets.ACR_NAME }} || true
          terraform import azurerm_container_group.aci /subscriptions/${{ secrets.SUBSCRIPTION_ID }}/resourceGroups/provision-user-rg/providers/Microsoft.ContainerInstance/containerGroups/provision-user || true
          terraform apply -auto-approve